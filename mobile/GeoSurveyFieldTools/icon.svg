<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1565C0"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB300"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="240" height="240" rx="32" ry="32" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#FFB300" stroke-width="2" opacity="0.8"/>

  <!-- Crosshair center -->
  <circle cx="128" cy="128" r="6" fill="#FFB300"/>
  <circle cx="128" cy="128" r="2" fill="#FFFFFF"/>
  <line x1="128" y1="30" x2="128" y2="90" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <line x1="128" y1="166" x2="128" y2="226" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="128" x2="90" y2="128" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <line x1="166" y1="128" x2="226" y2="128" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

  <!-- Compass needle -->
  <polygon points="128,48 148,128 128,110 108,128" fill="#FF8F00" stroke="#FFFFFF" stroke-width="1.5"/>
  <polygon points="128,208 108,128 128,146 148,128" fill="#FFB300" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Label -->
  <text x="128" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" letter-spacing="2">GeoSurvey</text>
</svg>